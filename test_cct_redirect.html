<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Chrome Custom Tabs Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #2b2b2b;
        }
        #timer {
            font-size: 24px;
            margin-top: 20px;
            color: #d9534f;
        }
        .btn {
            display: inline-block;
            padding: 14px 22px;
            background: #4285F4;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>

    <script>
        let seconds = 15;

        function startCountdown() {
            const timer = document.getElementById("timer");
            timer.innerText = "Повернення через " + seconds + " секунд...";

            // 15-секундний таймер для повернення в додаток
            const interval = setInterval(() => {
                seconds--;
                timer.innerText = "Повернення через " + seconds + " секунд...";

                if (seconds <= 0) {
                    clearInterval(interval);

                    // 🔥 DEEP LINK REDIRECT
                    window.location.href = "sportlife://payment/success?uid=test-deeplink-123";
                }
            }, 1000);
        }

        window.onload = startCountdown;
    </script>
</head>

<body>
    <h1>Chrome Custom Tabs Redirect Test</h1>

    <p>
        Натисніть кнопку нижче, щоби відкрити Google Pay Demo.<br><br>
        Через 15 секунд Custom Tab автоматично поверне вас у додаток.
    </p>

    <!-- 🔵 Кнопка, по якій користувач ПОВИНЕН натиснути -->
    <a class="btn" href="https://developers.google.com/pay/api/web/guides/resources/demos">
        Відкрити Google Pay Demo
    </a>

    <div id="timer">Повернення через 15 секунд...</div>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Chrome Custom Tabs Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #2b2b2b;
        }
        #timer {
            font-size: 24px;
            margin-top: 20px;
            color: #d9534f;
        }
    </style>

    <script>
        let seconds = 15;

        function startCountdown() {
            const timer = document.getElementById("timer");
            timer.innerText = "Повернення через " + seconds + " секунд...";

            // 1️⃣ Через 1 секунду автоматично переходимо на Google Pay demo
            setTimeout(() => {
                window.location.href = "https://developers.google.com/pay/api/web/guides/resources/demos";
            }, 1000);

            // 2️⃣ Продовжуємо працювати таймер → через 15 сек повертаємо в апп
            const interval = setInterval(() => {
                seconds--;
                timer.innerText = "Повернення через " + seconds + " секунд...";

                if (seconds <= 0) {
                    clearInterval(interval);

                    // 🔥 DEEP LINK REDIRECT
                    window.location.href = "sportlife://payment/success?uid=test-deeplink-123";
                }
            }, 1000);
        }

        window.onload = startCountdown;
    </script>
</head>

<body>
    <h1>Chrome Custom Tabs Redirect Test</h1>

    <p>
        Зараз відкриється сторінка Google Pay Demo.
        <br><br>
        Через 15 секунд Chrome Custom Tab автоматично поверне вас у додаток
        через <strong>DeepLink</strong>.
    </p>

    <div id="timer">Повернення через 15 секунд...</div>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Chrome Custom Tabs Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #2b2b2b;
        }
        #timer {
            font-size: 24px;
            margin-top: 20px;
            color: #d9534f;
        }
        .btn {
            display: inline-block;
            padding: 14px 22px;
            background: #4285F4;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>

    <script>
        let seconds = 15;

        function startCountdown() {
            const timer = document.getElementById("timer");
            timer.innerText = "Повернення через " + seconds + " секунд...";

            // 15-секундний таймер для повернення в додаток
            const interval = setInterval(() => {
                seconds--;
                timer.innerText = "Повернення через " + seconds + " секунд...";

                if (seconds <= 0) {
                    clearInterval(interval);

                    // 🔥 DEEP LINK REDIRECT
                    // тут підставляєш те, з чим саме зараз тестуєш:
                    // 1) або кастом-схему:
                    // window.location.href = "sportlife://payment/success?uid=123";
                    // 2) або intent-схему:
                    window.location.href =
                        "intent://payment/success?uid=123#Intent;scheme=sportlife;package=ua.sportlife.customer;end;";
                }
            }, 1000);
        }

        window.onload = startCountdown;
    </script>
</head>

<body>
    <h1>Chrome Custom Tabs Redirect Test</h1>

    <p>
        Через 15 секунд ця вкладка спробує повернути вас у додаток через deep link.
    </p>

    <div id="timer">Повернення через 15 секунд...</div>
</body>
</html>
